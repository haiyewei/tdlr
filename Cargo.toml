[package]
name = "tdlr"
version = "0.2.1"
edition = "2021"
description = "TDLR - A modular Rust CLI application"

[lib]
name = "tdlr_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "tdlr"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4"
grammers-client = "0.9.0"
tokio = { version = "1.49.0", features = ["rt", "time"] }

[dependencies]
chrono = "0.4"
clap = { version = "4.5.60", features = ["derive", "env", "color"] }
colored = "3.1"
evalexpr = "13.1"
anyhow = "1.0.102"
grammers-client = { version = "0.9.0", features = ["html"] }
grammers-session = "0.9.0"
grammers-mtsender = "0.9.0"
grammers-tl-types = "0.9.0"
tokio = { version = "1.49.0", features = ["full"] }
qrcode = "0.14.1"
base64-url = "3.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.18"
futures = "0.3"
regex = "1.12"
dirs = "6.0.0"

# JNI support for Android
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[features]
default = []
android = []
